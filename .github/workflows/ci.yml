name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a deploy never stops halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total
              const rows = ["lines", "statements", "functions", "branches"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              console.log(["### Coverage (src/core, tools)", "", "| metric | % | covered |", "| --- | --- | --- |", ...rows].join("\n"))
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: pnpm exec vite build

  decks:
    name: Build and check decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on invalid decks, duplicate flags, stale overrides, and built
      # files in public/data/decks/ that don't match their sources.
      - name: Build decks
        run: pnpm deck:build --check

      - name: Check decks
        run: pnpm decks:check

      # The Flutter app's tests compare its Dart ports against these.
      - name: Check Flutter parity fixtures are up to date
        run: |
          pnpm dart:golden
          git diff --exit-code -- app/test/fixtures || {
            echo "::error::Run 'pnpm dart:golden' and commit app/test/fixtures."
            exit 1
          }

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --no-web-resources-cdn

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Write the offline service worker
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm flutter:sw

  native:
    name: Build ${{ matrix.name }}
    needs: flutter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            build: flutter build apk --release
            artifact: app/build/app/outputs/flutter-apk/app-release.apk
          - name: iOS
            os: macos-latest
            build: flutter build ios --release --no-codesign
            artifact: ''
          - name: macOS
            os: macos-latest
            # Zipped with ditto so the bundle keeps its symlinks and permissions.
            build: >-
              flutter build macos --release &&
              ditto -c -k --keepParent build/macos/Build/Products/Release/cliflashcards.app build/cli-flashcards-macos.zip
            artifact: app/build/cli-flashcards-macos.zip
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Build
        run: ${{ matrix.build }}

      - if: matrix.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: cli-flashcards-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, decks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build decks
        run: pnpm deck:build

      # Fails the deploy if a deck is invalid.
      - name: Check decks
        run: pnpm decks:check

      - name: Build app
        run: pnpm exec vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages has no SPA fallback: serve the app for deep links such as /decks.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
