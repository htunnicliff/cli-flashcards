name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a deploy never stops halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total
              const rows = ["lines", "statements", "functions", "branches"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              console.log(["### Coverage (src/core, tools)", "", "| metric | % | covered |", "| --- | --- | --- |", ...rows].join("\n"))
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: pnpm exec vite build

  decks:
    name: Build and check decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on invalid decks, duplicate flags, stale overrides, and built
      # files in public/data/decks/ that don't match their sources.
      - name: Build decks
        run: pnpm deck:build --check

      - name: Check decks
        run: pnpm decks:check

      # The Swift and Flutter apps' tests compare their ports against these.
      - name: Check parity fixtures are up to date
        run: |
          pnpm dart:golden
          git diff --exit-code -- apple/FlashcardsCore/Tests/Fixtures || {
            echo "::error::Run 'pnpm dart:golden' and commit apple/FlashcardsCore/Tests/Fixtures."
            exit 1
          }

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --wasm --no-web-resources-cdn

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Write the offline service worker
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm flutter:sw

  native:
    name: Build ${{ matrix.name }}
    needs: flutter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            build: flutter build apk --release
            artifact: app/build/app/outputs/flutter-apk/app-release.apk
          - name: iOS
            os: macos-latest
            build: flutter build ios --release --no-codesign
            artifact: ''
          - name: macOS
            os: macos-latest
            # Zipped with ditto so the bundle keeps its symlinks and permissions.
            build: >-
              flutter build macos --release &&
              ditto -c -k --keepParent build/macos/Build/Products/Release/cliflashcards.app build/cli-flashcards-macos.zip
            artifact: app/build/cli-flashcards-macos.zip
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Build
        run: ${{ matrix.build }}

      - if: matrix.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: cli-flashcards-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 14

  # The Skip app's core logic is plain Swift, so its tests (including parity
  # with the TypeScript code) run on Linux, which is quicker and cheaper.
  swift-core:
    name: Swift core tests
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: apple/FlashcardsCore
    steps:
      - uses: actions/checkout@v7

      - run: swift test

  skip:
    name: Skip app (${{ matrix.name }})
    needs: swift-core
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
          - name: Android
            destination: ''
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Install Skip
        run: brew install skiptools/skip/skip

      - uses: actions/cache@v5
        with:
          path: apple/.build
          key: skip-${{ matrix.name }}-${{ hashFiles('apple/Package.swift', 'apple/FlashcardsCore/Package.swift') }}
          restore-keys: skip-${{ matrix.name }}-

      # SKIP_ACTION=none skips the Xcode build phase that builds and launches
      # the Android app; the Android row builds it on its own.
      - name: Build
        if: matrix.name != 'Android'
        run: >-
          xcodebuild build
          -workspace Project.xcworkspace
          -scheme "CLIFlashcards App"
          -destination "${{ matrix.destination }}"
          -derivedDataPath build/DerivedData
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO SKIP_ACTION=none

      - if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android
        if: matrix.name == 'Android'
        run: |
          skip android sdk install
          skip export --debug -d build/export
          ls -la build/export

      - if: matrix.name == 'Android'
        uses: actions/upload-artifact@v7
        with:
          name: cli-flashcards-skip-android
          path: apple/build/export/*.apk
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Building and deploying are separate jobs, as in GitHub's Pages starter
  # workflow: deploy-pages lists the run's artifacts, and from the job that
  # just uploaded github-pages it didn't see it ("No artifacts named
  # github-pages"). From a later job it sees artifacts of finished jobs.
  pages:
    name: Build GitHub Pages site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, decks, e2e, flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build decks
        run: pnpm deck:build

      # Fails the deploy if a deck is invalid.
      - name: Check decks
        run: pnpm decks:check

      # The Vue app stays at /classic/ on the same origin, so its saved
      # progress can still be exported as a backup and imported in the new app.
      - name: Build the classic app
        run: |
          pnpm exec vite build
          mkdir -p site
          mv dist site/classic
        env:
          BASE_PATH: /${{ github.event.repository.name }}/classic/

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn \
            --base-href /${{ github.event.repository.name }}/
          cp -r build/web/. ../site/
          cp -r ../public/data ../site/data

      - name: Write the offline service worker
        run: pnpm flutter:sw site

      # Pages has no SPA fallback: serve the app for deep links such as /decks.
      - name: Add SPA fallback
        run: cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
