name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total
              const rows = ["lines", "statements", "functions", "branches"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              console.log(["### Coverage (pipeline, tools)", "", "| metric | % | covered |", "| --- | --- | --- |", ...rows].join("\n"))
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  decks:
    name: Build and check decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on invalid decks, duplicate flags, stale overrides, and built
      # files in public/data/decks/ that don't match their sources.
      - name: Build decks
        run: pnpm deck:build --check

      - name: Check decks
        run: pnpm decks:check

      # The Swift tests compare their ports against these.
      - name: Check parity fixtures are up to date
        run: |
          pnpm fixtures:golden
          git diff --exit-code -- apple/FlashcardsCore/Tests/Fixtures || {
            echo "::error::Run 'pnpm fixtures:golden' and commit apple/FlashcardsCore/Tests/Fixtures."
            exit 1
          }

  # The Skip app's core logic is plain Swift, so its tests (including parity
  # with the TypeScript code) run on Linux, which is quicker and cheaper.
  swift-core:
    name: Swift core tests
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: apple/FlashcardsCore
    steps:
      - uses: actions/checkout@v7

      - run: swift test

  skip:
    name: Skip app (${{ matrix.name }})
    needs: swift-core
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
          - name: Android
            destination: ''
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Install Skip
        run: brew install skiptools/skip/skip

      - uses: actions/cache@v5
        with:
          path: apple/.build
          key: skip-${{ matrix.name }}-${{ hashFiles('apple/Package.swift', 'apple/FlashcardsCore/Package.swift') }}
          restore-keys: skip-${{ matrix.name }}-

      # SKIP_ACTION=none skips the Xcode build phase that builds and launches
      # the Android app; the Android row builds it on its own.
      - name: Build
        if: matrix.name != 'Android'
        run: >-
          xcodebuild build
          -workspace Project.xcworkspace
          -scheme "CLIFlashcards App"
          -destination "${{ matrix.destination }}"
          -derivedDataPath build/DerivedData
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO SKIP_ACTION=none

      - if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android
        if: matrix.name == 'Android'
        run: |
          skip android sdk install
          # Skip writes compiler errors to a log file, not the job output.
          if ! skip export --debug -d build/export; then
            grep -hE "(error|warning: unavailable):" /tmp/skip-export-*.txt | sort -u | head -100
            exit 1
          fi
          ls -la build/export

      - if: matrix.name == 'Android'
        uses: actions/upload-artifact@v7
        with:
          name: cli-flashcards-skip-android
          path: apple/build/export/*.apk
          retention-days: 14
          if-no-files-found: warn
