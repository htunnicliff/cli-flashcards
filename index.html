<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121315" />
    <title>--recall</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/recursive-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Apply the saved theme and text size before first paint (no flash of the wrong theme).
      // Mirrors applyAppearance() in src/app/stores/appearance.ts.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('recall:appearance') || '{}')
          var root = document.documentElement
          if (saved.theme === 'light' || saved.theme === 'dark') {
            root.dataset.theme = saved.theme
            var color = saved.theme === 'dark' ? '#121315' : '#F6F5F2'
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.content = color
            })
          }
          if (saved.fontSize === 's' || saved.fontSize === 'l')
            root.dataset.fontSize = saved.fontSize
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
