# yaml-language-server: $schema=../../schemas/overrides.schema.json
#
# Curation for the BSD (FreeBSD and macOS) sed deck. Applied on top of
# bsd.generated.json by `pnpm deck:build`; regenerating the deck keeps these edits.

options:
  short-E:
    summary: Use extended regular expressions (no backslashes before ( ) + ?)
    # The shared tldr example uses \U, which BSD sed doesn't support.
    replaceExamples: true
    examples:
      - command: sed -E 's/([0-9]+)-([0-9]+)/\2-\1/' path/to/file
        description: Swap two hyphen-separated numbers
  short-e:
    tier: core
    summary: Add a script command; repeat to run several in order
    examples:
      - command: sed -e 's/foo/bar/' -e '/^#/d' path/to/file
        description: Replace foo and delete comment lines in one pass
  short-f:
    summary: Read sed commands from a script file
  short-i:
    summary: Edit files in place; the backup suffix argument is required ('' for none)
    replaceExamples: true
    examples:
      - command: sed -i '' 's/apple/mango/g' path/to/file
        description: Edit a file in place without keeping a backup
      - command: sed -i .bak 's/apple/mango/g' path/to/file
        description: Edit in place and keep the original as path/to/file.bak
  short-n:
    summary: Only print lines the script prints explicitly (with p)
  short-r:
    summary: Same as -E; accepted for compatibility with GNU sed
