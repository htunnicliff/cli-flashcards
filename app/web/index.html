<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // This page is also the site's 404 page. A reload deep inside the classic
    // app (/classic/settings) lands here, so send it to that app's start page.
    (function () {
      var m = location.pathname.match(/^(.*\/classic)(\/.*)?$/)
      if (m && m[2] && m[2] !== '/') location.replace(m[1] + '/')
    })()
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spaced repetition flashcards for learning command-line flags.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121315">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="--recall">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <title>--recall</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F6F5F2; }
    @media (prefers-color-scheme: dark) { html, body { background: #121315; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
