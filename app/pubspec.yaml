name: cliflashcards
description: "Spaced repetition flashcards for command-line flags."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  http: ^1.6.0
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # A symlink to public/data/decks, built by `pnpm deck:build`. The app ships
    # these for the first launch offline, then downloads updates.
    - assets/decks/
